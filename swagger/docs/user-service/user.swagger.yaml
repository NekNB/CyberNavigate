openapi: 3.0.3

info:
  title: API CyberNavigate
  version: "1.0"
  description: |
    API сервиса пользователей с авторизацией по username/password.
    Аутентификация реализована через access и refresh JWT токены.
servers:
  - url: http://localhost:9000/api/v1
    description: Local API Gateway Server
  - url: http://127.0.0.1:9000/api/v1
    description: Local API Gateway Server
  - url: http://cyber-navigate_gateway-server/api/v1
    description: Internal Docker API Gateway Server

tags:
  - name: Auth
    description: Методы авторизации и аутентификации
  - name: Users
    description: Методы работы с пользователем
  - name: Admin
    description: Методы работы с пользователем для администраторов

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Авторизация пользователя
      description: Возвращает access и refresh токены
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Успешная авторизация
          headers:
            Set-Cookie:
              description: |
                Sets access and refresh tokens as HTTP-only cookies
              schema:
                type: string
                example: "access_token=eyJhbGciOiJSUzI1NiIs...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=900"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неверный username или password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновление access токена
      description: Выдает новую пару access/refresh токенов
      operationId: refreshToken
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Успешная авторизация
          headers:
            Set-Cookie:
              description: |
                Sets access and refresh tokens as HTTP-only cookies
              schema:
                type: string
                example: "access_token=eyJhbGciOiJSUzI1NiIs...; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=900"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Refresh токен невалиден или истек
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Выход пользователя
      description: Инвалидирует refresh токен
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Успешный logout
        "401":
          description: Неавторизован

  /users/me:
    get:
      tags:
        - Users
      summary: Получить текущего пользователя
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Информация о текущем пользователе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      tags:
        - Admin
      summary: Получить список пользователей
      operationId: getAllUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Информация о всех пользователях
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "401":
          description: Неавторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: В доступе отказано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Users
      summary: Создать пользователя
      operationId: postNewUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
      responses:
        "200":
          description: Информация о всех пользователях
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "400":
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: johndoe
        password:
          type: string
          format: password
          example: secret123

    UserResponse:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
          example: 2b1c6d2c-4e6f-4c9b-a2b4-8f1d2c3e4f5a
        username:
          type: string
          example: johndoe
        createdAt:
          type: string
          format: date-time
          example: 2026-05-11T10:00:00Z

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: All Ok

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid credentials

env: "local"

server:
    host: 127.0.0.1
    http_port: 9080
    https_port: 9443

    services:
        - article-service:
              path: /api/v1/articles
              protocol: https
              host: 127.0.0.1
              port: 8000
        - user-service:
              path: /api/v1/users
              protocol: https
              host: 127.0.0.1
              port: 8000
        - user-service:
              path: /api/v1/auth
              protocol: https
              host: 127.0.0.1
              port: 8000

public_key_path: ../../secrets/keys/public.pem

certs:
    ca_cert: ../../secrets/certs/gateway-server/ca-cert.pem

    client_cert: ../../secrets/certs/gateway-server/client-cert.pem
    client_key: ../../secrets/certs/gateway-server/client-key.pem

    public_cert: ../../secrets/certs/gateway-server/public-cert.pem
    public_key: ../../secrets/certs/gateway-server/public-key.pem

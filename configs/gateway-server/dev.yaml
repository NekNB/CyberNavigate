env: "dev"

server:
        host: 0.0.0.0
        http_port: 80
        https_port: 443

        services:
                - article-service:
                          path: /api/v1/articles
                          protocol: https
                          host: cyber-navigate_article-service
                          port: 8000
                - user-service:
                          path: /api/v1/users
                          protocol: https
                          host: cyber-navigate_user-service
                          port: 8000
                - user-service:
                          path: /api/v1/auth
                          protocol: https
                          host: cyber-navigate_user-service
                          port: 8000
                - simulator-service:
                          path: /api/v1/simulator
                          protocol: https
                          host: cyber-navigate_simulator-service
                          port: 8000
        allow_headers:
                - "X-User-Id"
                - "Origin"
                - "Content-Type"
                - "Accept"
                - "Authorization"
                - "Content-Encoding"
        allow_origins:
                - "https://api.кибер-навигатор.рф"
                - "https://www.кибер-навигатор.рф"
                - "https://api.xn----8sbabhgkwfn1brsi2a.xn--p1ai"
                - "https://www.xn----8sbabhgkwfn1brsi2a.xn--p1ai"


public_key_path: ./keys/public.pem

certs:
        ca_cert: /certs/ca-cert.pem

        client_cert: /certs/client-cert.pem
        client_key: /certs/client-key.pem

        public_cert: /certs/public-cert.pem
        public_key: /certs/public-key.pem



services:



  postgres:
    image: cyber-navigate/postgres
    ports:
      - target: 5432
        published: 5777
        protocol: tcp
        mode: host

    secrets:
      - source: postgres_secret
        target: postgres_secret
    deploy:
      replicas: 1


volumes:
  portainer_data:
    driver: local # Создаем том для хранения данных Portainer



secrets:
  postgres_secret:
    external: true
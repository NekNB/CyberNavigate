

services:
  docker-cleanup:
    image: docker:latest
    command: >
      sh -c "while true; do
        docker container prune -f;
        sleep 600;
      done"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: global
      restart_policy:
        condition: any
      replicas: 1
        
  mongo:
    image: cyber-navigate/mongo
    ports:
      - target: 27017
        published: 27017
        protocol: tcp
        mode: host

    secrets:
      - source: mongo_secret
        target: mongo_secret
    deploy:
      replicas: 1

  # volumes:
  #   - ./secrets/mongo.secret.env:/secrets/mongo.secret.env

  # volumes:
  #   - mongo_data:/data/db

  postgres:
    image: cyber-navigate/postgres
    ports:
      - target: 5432
        published: 5777
        protocol: tcp
        mode: host

    secrets:
      - source: postgres_secret
        target: postgres_secret
    deploy:
      replicas: 1


volumes:
  mongo_data:



  



secrets:
  postgres_secret:
    external: true
  mongo_secret:
    external: true
server {
    listen 80;
    server_name api.кибер-навигатор.рф www.кибер-навигатор.рф;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.кибер-навигатор.рф;

    ssl_certificate /etc/letsencrypt/live/api.кибер-навигатор.рф/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.кибер-навигатор.рф/privkey.pem;

    location / {
        proxy_pass http://cyber-navigate_gateway-server:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name www.кибер-навигатор.рф;

    ssl_certificate /etc/letsencrypt/live/api.кибер-навигатор.рф/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.кибер-навигатор.рф/privkey.pem;

    location / {
        proxy_pass http://cyber-navigate_frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}